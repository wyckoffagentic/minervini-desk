<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="williams-t williams-d">
  <title id="williams-t">Williams lens (VSA) avatar</title>
  <desc id="williams-d">Symbolic avatar: a single high-low-close price bar with a close tick and no open tick, standing over a towering ultra-high volume bar, a long steel ruler lying across them, and faint weighing-scale pans labelled supply and demand. Not a likeness of any person.</desc>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="#fbecec" stroke="#1d1b3a" stroke-width="5"/>
  <!-- faint weighing scale in the background -->
  <g opacity=".32" stroke="#1d1b3a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M100 26 V44"/>
    <path d="M40 44 H160"/>
    <path d="M48 44 L36 72 M48 44 L60 72 M152 44 L140 72 M152 44 L164 72"/>
    <path d="M32 72 Q48 86 64 72Z M136 72 Q152 86 168 72Z" fill="#ffffff"/>
  </g>
  <g opacity=".55" font-family="Fredoka,'Baloo 2',system-ui,sans-serif" font-weight="700" font-size="10" fill="#1d1b3a" text-anchor="middle">
    <text x="48" y="98">SUPPLY</text>
    <text x="152" y="98">DEMAND</text>
  </g>
  <!-- HLC price bar: high-low line plus a close tick on the right, no open tick -->
  <path d="M100 30 V80" stroke="#1d1b3a" stroke-width="12" stroke-linecap="round"/>
  <path d="M100 30 V80" stroke="#2E7D32" stroke-width="6" stroke-linecap="round"/>
  <path d="M100 38 H122" stroke="#1d1b3a" stroke-width="10" stroke-linecap="round"/>
  <path d="M100 38 H121" stroke="#2E7D32" stroke-width="4.5" stroke-linecap="round"/>
  <!-- volume floor, two small prior bars, then the ultra-high bar -->
  <path d="M28 176 H172" stroke="#1d1b3a" stroke-width="4" stroke-linecap="round"/>
  <rect x="50" y="154" width="18" height="22" rx="3" fill="#e7b3b5" stroke="#1d1b3a" stroke-width="3.5"/>
  <rect x="132" y="160" width="18" height="16" rx="3" fill="#e7b3b5" stroke="#1d1b3a" stroke-width="3.5"/>
  <rect x="86" y="104" width="28" height="72" rx="4" fill="#A4262C" stroke="#1d1b3a" stroke-width="4.5"/>
  <path d="M93 112 V168" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity=".5"/>
  <!-- long steel ruler across the bars -->
  <g transform="rotate(-14 100 128)">
    <rect x="16" y="120" width="168" height="16" rx="3" fill="#c9ced6" stroke="#1d1b3a" stroke-width="4"/>
    <path d="M20 124 H180" stroke="#ffffff" stroke-width="2" opacity=".8"/>
    <g stroke="#1d1b3a" stroke-width="1.8">
      <path d="M28 136v-6M40 136v-4M52 136v-6M64 136v-4M76 136v-6M88 136v-4M100 136v-7M112 136v-4M124 136v-6M136 136v-4M148 136v-6M160 136v-4M172 136v-6"/>
    </g>
  </g>
</svg>
