<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="wyckoff-t wyckoff-d">
  <title id="wyckoff-t">Wyckoff lens avatar</title>
  <desc id="wyckoff-d">Symbolic avatar: a brass 1920s stock ticker under a glass dome, a curl of paper tape spilling out, and a small feather balanced on the tape. Not a likeness of any person.</desc>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="#F3EAD8" stroke="#1d1b3a" stroke-width="5"/>
  <!-- paper tape curling out to the right, feather on top -->
  <path d="M124 128 C150 128 168 132 172 146 C176 160 160 170 146 164 C136 160 140 150 150 152" fill="none" stroke="#1d1b3a" stroke-width="15" stroke-linecap="round"/>
  <path d="M124 128 C150 128 168 132 172 146 C176 160 160 170 146 164 C136 160 140 150 150 152" fill="none" stroke="#fffaf0" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#8C6A3F" stroke-width="1.6" stroke-linecap="round">
    <path d="M132 128h5M142 128.5h3M150 129.5h6M161 132h3"/>
  </g>
  <!-- feather balanced on the tape -->
  <g transform="translate(150 121) rotate(-18)">
    <path d="M-22 0 C-12 -9 8 -9 22 -2 C8 5 -12 5 -22 0Z" fill="#fffaf0" stroke="#1d1b3a" stroke-width="2.5"/>
    <path d="M-24 1 L20 -2" stroke="#1d1b3a" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8 -1 l-4 -5 M0 -1.5 l-3 -6 M8 -2 l-2 -5 M-6 1 l-4 4 M2 0.5 l-3 4" stroke="#8C6A3F" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- wooden plinth -->
  <rect x="34" y="150" width="104" height="18" rx="6" fill="#6b4f2c" stroke="#1d1b3a" stroke-width="4"/>
  <rect x="44" y="142" width="84" height="12" rx="4" fill="#8C6A3F" stroke="#1d1b3a" stroke-width="4"/>
  <!-- ticker mechanism: pedestal, body, wheel -->
  <path d="M74 142 L80 118 H92 L98 142Z" fill="#b8924f" stroke="#1d1b3a" stroke-width="4" stroke-linejoin="round"/>
  <rect x="58" y="96" width="56" height="26" rx="6" fill="#c9a45c" stroke="#1d1b3a" stroke-width="4"/>
  <circle cx="86" cy="86" r="17" fill="#d9b86e" stroke="#1d1b3a" stroke-width="4"/>
  <circle cx="86" cy="86" r="6" fill="#8C6A3F" stroke="#1d1b3a" stroke-width="3"/>
  <g stroke="#1d1b3a" stroke-width="2.5" stroke-linecap="round">
    <path d="M86 72v6M86 94v6M72 86h6M94 86h6M76 76l4 4M92 92l4 4M96 76l-4 4M80 92l-4 4"/>
  </g>
  <!-- tape leaving the ticker -->
  <path d="M114 112 C120 116 120 126 126 128" fill="none" stroke="#1d1b3a" stroke-width="13" stroke-linecap="round"/>
  <path d="M114 112 C120 116 120 126 126 128" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round"/>
  <!-- glass dome -->
  <path d="M46 144 V78 C46 44 126 44 126 78 V144" fill="#dff3ff" fill-opacity=".35" stroke="#1d1b3a" stroke-width="4.5"/>
  <circle cx="86" cy="42" r="6" fill="#c9a45c" stroke="#1d1b3a" stroke-width="3.5"/>
  <path d="M58 76 C58 60 68 54 78 52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <path d="M58 90 V118" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
</svg>
