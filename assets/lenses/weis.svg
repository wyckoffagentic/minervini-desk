<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="weis-t weis-d">
  <title id="weis-t">Weis lens (waves) avatar</title>
  <desc id="weis-d">Symbolic avatar: a hand-drawn pencil zig-zag wave line on graph paper with each swing's cumulative volume bar beneath it; the last up-wave's bar is visibly shorter, and a small springboard sits at the support line. Not a likeness of any person.</desc>
  <defs>
    <pattern id="weis-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#1F7A8C" stroke-width=".8" opacity=".22"/>
    </pattern>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="#eef8fa"/>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="url(#weis-grid)"/>
  <!-- support line (the story of the lines) -->
  <path d="M16 112 H184" stroke="#1F7A8C" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
  <path d="M20 46 L146 76" stroke="#1F7A8C" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round" opacity=".7"/>
  <!-- springboard at the support line -->
  <path d="M136 112 H176" stroke="#1d1b3a" stroke-width="9" stroke-linecap="round"/>
  <path d="M136 112 H176" stroke="#f2c14e" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M166 114 L160 128 H176 L172 114" fill="#4A4A4A" stroke="#1d1b3a" stroke-width="3" stroke-linejoin="round"/>
  <!-- the pencil wave: thrusts shorten, pullbacks hold the line -->
  <polyline points="20,104 46,48 68,100 94,64 116,106 136,82 150,108" fill="none" stroke="#1d1b3a" stroke-width="7.5" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="20,104 46,48 68,100 94,64 116,106 136,82 150,108" fill="none" stroke="#4A4A4A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="150" cy="108" r="5" fill="#1F7A8C" stroke="#1d1b3a" stroke-width="2.5"/>
  <!-- cumulative wave-volume bars, one per swing -->
  <path d="M16 178 H184" stroke="#1d1b3a" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#1d1b3a" stroke-width="3" stroke-linejoin="round">
    <rect x="26" y="136" width="14" height="42" rx="2.5" fill="#1F7A8C"/>
    <rect x="50" y="154" width="14" height="24" rx="2.5" fill="#9a9a9a"/>
    <rect x="74" y="146" width="14" height="32" rx="2.5" fill="#1F7A8C"/>
    <rect x="98" y="162" width="14" height="16" rx="2.5" fill="#9a9a9a"/>
    <rect x="120" y="164" width="14" height="14" rx="2.5" fill="#1F7A8C"/>
    <rect x="140" y="172" width="14" height="6" rx="2" fill="#9a9a9a"/>
  </g>
  <!-- pencil resting in the corner -->
  <g transform="translate(160 44) rotate(-45)">
    <rect x="-26" y="-6" width="40" height="12" rx="2" fill="#f2c14e" stroke="#1d1b3a" stroke-width="3"/>
    <rect x="-34" y="-6" width="9" height="12" rx="2.5" fill="#ff9ecf" stroke="#1d1b3a" stroke-width="3"/>
    <path d="M14 -6 L28 0 L14 6Z" fill="#f6dcb0" stroke="#1d1b3a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M23 -2.2 L28 0 L23 2.2Z" fill="#4A4A4A"/>
  </g>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="none" stroke="#1d1b3a" stroke-width="5"/>
</svg>
